[package]
name = "rustkorea"
version = "0.5.0"
edition = "2024"
authors = ["Rust Korea"]
license = "MIT"
description = "Rust Korea Hub community platform"
repository = "https://github.com/rustkorea/rustkorea"
homepage = "https://rustkorea.kr"
keywords = ["rust", "community", "web"]
categories = ["web-programming"]
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net"] }
topcoat = { version = "0.10", features = ["tailwind", "runtime", "session", "cookie", "asset", "sse", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = "0.12"
ammonia = "4"
htmd = "0.5"
thiserror = { version = "2" }
anyhow = { version = "1" }
argon2 = { version = "0.5" }
getrandom = { version = "0.2" }
rand = "0.8"
form_urlencoded = { version = "1" }
quick-xml = { version = "0.41", features = ["serialize"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth", "qr"] }
pdf-extract = { version = "0.12" }

[build-dependencies]
topcoat = { version = "0.10", features = ["tailwind"] }
